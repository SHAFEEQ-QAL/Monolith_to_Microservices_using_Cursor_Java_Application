spring.application.name=employee-management-monolith
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:employee_user}
spring.datasource.password=${DB_PASSWORD:employee_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=Employee Management Monolith
info.app.description=Practice application for migration to microservices

department.service.base-url=${DEPARTMENT_SERVICE_BASE_URL:http://localhost:8081}

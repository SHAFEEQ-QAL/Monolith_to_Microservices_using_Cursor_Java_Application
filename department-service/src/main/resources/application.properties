spring.application.name=department-service
server.port=8081
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.datasource.url=${DEPARTMENT_DB_URL:jdbc:mysql://localhost:3306/department_db?serverTimezone=UTC}
spring.datasource.username=${DEPARTMENT_DB_USERNAME:employee_user}
spring.datasource.password=${DEPARTMENT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
